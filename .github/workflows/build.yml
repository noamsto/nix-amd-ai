name: Build and cache

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Each push to main gets its own group, so main runs never contend. A shared
  # group keeps only ONE pending run: a third merge arriving while one run is
  # in progress and another is queued evicts the queued one, and the release it
  # would have tagged goes with it. cancel-in-progress does not cover that --
  # it protects in-progress runs, not pending ones. PRs still share a per-ref
  # group, where superseding a force-pushed run is the point.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ROCm backends are the critical path -- 33 of the 35 minutes a cold
  # `build` job takes, sharing its 4 cores. A runner each doubles that, and
  # standard runners are free and unmetered on public repos, so the only cost
  # is two extra checkouts; `build` then substitutes both instead of building.
  rocm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [llama-cpp-rocm, llama-cpp-rocm-gsqhalo, stable-diffusion-cpp-rocm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-amd-ai
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build ${{ matrix.package }}
        run: nix build -L .#${{ matrix.package }}

  # The open NPU kernel export is one derivation per set; a matrix runner each
  # exports one set in parallel instead of one job exporting all of them
  # serially, and the join that `build` needs substitutes them from Cachix.
  # The set list is kernel-sets.json, read through the flake attr so it cannot
  # drift from the per-set derivations.
  npu-kernel-sets:
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.list.outputs.sets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: List kernel sets
        id: list
        # Assign first: under the shell's `-e`, a failed substitution inside
        # echo's argument is swallowed, but a failed assignment aborts the step.
        run: |
          sets=$(nix eval --json .#openflowlm.kernels.passthru.sets --apply builtins.attrNames)
          echo "sets=$sets" >> "$GITHUB_OUTPUT"

  npu-kernels:
    needs: npu-kernel-sets
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.npu-kernel-sets.outputs.sets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-amd-ai
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build openflowlm kernel set ${{ matrix.set }}
        env:
          SET: ${{ matrix.set }}
        run: |
          [[ $SET =~ ^[A-Za-z0-9._-]+$ ]] || { echo "unexpected set name: $SET" >&2; exit 1; }
          nix build -L ".#openflowlm.kernels.passthru.sets.\"$SET\""

  build:
    needs: [rocm, npu-kernel-sets, npu-kernels]
    # A failed upstream job would otherwise SKIP this job, and the ruleset
    # counts a skipped required check as passing. Run unless cancelled, and fail
    # in the first step instead; every later step is gated on its success.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::upstream job did not succeed: ${bad//$'\n'/, }"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-amd-ai
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build packages and checks
        # --skip-cached: outputs already in Cachix are neither downloaded (~3 GiB)
        # nor rebuilt. Build logs, including VM test boots, stay in the job log
        # as collapsed ::group:: folds.
        run: |
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --no-nom --skip-cached --eval-workers 4 --eval-max-memory-size 3072 \
            --flake '.#' --select 'o: {
              checks = o.checks.x86_64-linux;
              packages = { inherit (o.packages.x86_64-linux) xrt xrt-plugin-amdxdna fastflowlm lemonade lemonade-headless ds4 mlir-aie llvm-aie openflowlm; };
            }'
      - name: Evaluate remaining packages
        # Eval-only: catches eval errors in packages too heavy to build here.
        run: |
          nix eval .#packages.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)' >/dev/null
      - name: Verify lemond unit (systemd-analyze)
        run: |
          unit=$(nix build .#lemond-unit --print-out-paths)/lemond.service

          # Self-check: prove the verifier actually flags a bad unit, so a clean
          # pass below can't mask a missing/dead systemd-analyze on the runner.
          printf '[Unit]\nDescription=ctl\n[Service]\nExecStart=/bin/true\nRuntimeDirectory=/absolute/bad\n' > ctl.service
          systemd-analyze verify ctl.service 2>&1 | grep -qi 'RuntimeDirectory' \
            || { echo "systemd-analyze did not flag a known-bad unit; aborting"; exit 1; }

          # A valid unit yields no diagnostic mentioning our directives, so any
          # mention of them is a real problem. (ExecStart points at an unbuilt
          # store path, which verify reports separately — ignored via || true.)
          report=$(systemd-analyze verify "$unit" 2>&1 || true)
          echo "$report"
          if echo "$report" | grep -Ei 'RuntimeDirectory|NIX_LD'; then
            echo "systemd-analyze flagged lemond's directives"; exit 1
          fi

  build-darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-amd-ai
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build Lemonade (Metal)
        run: nix build .#lemonade .#benchmark
      - name: Check flake
        run: nix flake check

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Only release when the package set changed — skip CI/docs-only pushes.
          changed=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || git show --name-only --format= "$SHA")
          if ! echo "$changed" | grep -qE '^(flake\.(lock|nix)|pkgs/)'; then
            echo "No package changes in this push; skipping release."
            exit 0
          fi

          # First free vYYYY.MM.DD[-N] tag, so same-day re-cuts suffix instead of
          # silently skipping (the old behaviour stranded later merges).
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while git rev-parse "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}-${n}"
          done

          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            notes=$(git log --pretty='* %s (%h)' "${prev_tag}..HEAD")
          else
            notes="First tagged release."
          fi

          lem=$(sed -n 's/.*"\(.*\)".*/\1/p' pkgs/lemonade/version.nix | head -1)
          if [ -n "$lem" ]; then
            title="$tag — Lemonade $lem"
          else
            title="$tag"
          fi

          # Create the tag through the release API rather than `git push`. A tag
          # push from GITHUB_TOKEN is rejected -- "refusing to allow a GitHub App
          # to create or update workflow ... without workflows permission" --
          # whenever the tagged commit's .github/workflows differ from the branch
          # tip, which happens as soon as a later merge lands while this job is
          # still queued. --target takes the full SHA; an abbreviated one 422s.
          printf '%s\n' "$notes" | gh release create "$tag" --target "$SHA" --title "$title" --notes-file -
