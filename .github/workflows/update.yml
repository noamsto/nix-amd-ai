name: Check for upstream updates

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-amd-ai
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # vllm-rocm is a ~7.6 GB blob that turns over every few nightlies — one
          # build alone exceeds the 5 GB free tier, so it's built to *validate*
          # the bump but kept out of the cache push. Drop this filter once a paid
          # cachix plan has headroom, to serve it prebuilt to consumers.
          pushFilter: '(vllm)'

      - name: Check for new releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-updates.sh

      - name: Update nixpkgs lock
        if: steps.check.outputs.nixpkgs_needs_update == 'true'
        run: nix flake update nixpkgs

      - name: Bump versions
        if: steps.check.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FLM_LATEST: ${{ steps.check.outputs.flm_latest }}
          FLM_CURRENT: ${{ steps.check.outputs.flm_current }}
          LEM_LATEST: ${{ steps.check.outputs.lem_latest }}
          LEM_CURRENT: ${{ steps.check.outputs.lem_current }}
          XDNA_LATEST: ${{ steps.check.outputs.xdna_latest }}
          XDNA_CURRENT: ${{ steps.check.outputs.xdna_current }}
          VLLM_LATEST: ${{ steps.check.outputs.vllm_latest }}
          VLLM_CURRENT: ${{ steps.check.outputs.vllm_current }}
        run: |
          ./scripts/bump-versions.sh \
            "$FLM_LATEST" "$FLM_CURRENT" \
            "$LEM_LATEST" "$LEM_CURRENT" \
            "$XDNA_LATEST" "$XDNA_CURRENT" \
            "$VLLM_LATEST" "$VLLM_CURRENT"

      # vllm-rocm builds unpack ~7.6 GB; the runner's ~14 GB default isn't enough.
      # Reclaim the preinstalled Android/.NET/GHC toolchains (~25 GB) so the
      # validation build below fits. Only when vllm actually moved.
      - name: Free disk space for vllm-rocm build
        if: steps.check.outputs.vllm_needs_update == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: Validate flake eval
        if: steps.check.outputs.build_needed == 'true'
        id: flake_check
        continue-on-error: true
        run: |
          if nix flake check --no-build 2>&1 | tee /tmp/flake-check.log; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            # Random delimiter: this is nix output, so a line reading
            # CHECK_EOF would close the block early and let whatever follows
            # write arbitrary step outputs -- including the `status` that
            # gates auto-merge below.
            delim="EOF_$(openssl rand -hex 16)"
            {
              echo "log<<$delim"
              tail -40 /tmp/flake-check.log
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build updated packages
        if: steps.check.outputs.build_needed == 'true'
        id: build
        env:
          VLLM_NEEDS_UPDATE: ${{ steps.check.outputs.vllm_needs_update }}
        run: |
          FAILED=""
          PKGS="xrt xrt-plugin-amdxdna fastflowlm lemonade"
          # Validate the vllm-rocm bump only when it moved — building it (and
          # re-fetching 2.25 GB) every run when unchanged is pure waste since it
          # isn't in the cache. A build failure here blocks the auto-merge below.
          if [ "$VLLM_NEEDS_UPDATE" = "true" ]; then
            PKGS="$PKGS vllm-rocm"
          fi
          for pkg in $PKGS; do
            if ! nix build ".#$pkg"; then
              FAILED+="- ${pkg}"$'\n'
            fi
          done
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "failed<<$delim"
            printf '%s' "$FAILED"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR
        id: pr
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FLAKE_CHECK_LOG: ${{ steps.flake_check.outputs.log }}
          FLAKE_CHECK_STATUS: ${{ steps.flake_check.outputs.status }}
          BUILD_FAILED: ${{ steps.build.outputs.failed }}
          FLM_LATEST: ${{ steps.check.outputs.flm_latest }}
          FLM_CURRENT: ${{ steps.check.outputs.flm_current }}
          LEM_LATEST: ${{ steps.check.outputs.lem_latest }}
          LEM_CURRENT: ${{ steps.check.outputs.lem_current }}
          XDNA_LATEST: ${{ steps.check.outputs.xdna_latest }}
          XDNA_CURRENT: ${{ steps.check.outputs.xdna_current }}
          VLLM_LATEST: ${{ steps.check.outputs.vllm_latest }}
          VLLM_CURRENT: ${{ steps.check.outputs.vllm_current }}
          VLLM_NEEDS_UPDATE: ${{ steps.check.outputs.vllm_needs_update }}
          NIXPKGS_DIFFS: ${{ steps.check.outputs.nixpkgs_backend_diffs }}
          NIXPKGS_NEEDS_UPDATE: ${{ steps.check.outputs.nixpkgs_needs_update }}
          MTP_OVERRIDE_NEEDS_UPDATE: ${{ steps.check.outputs.mtp_override_needs_update }}
          MTP_CLEANUP: ${{ steps.check.outputs.mtp_cleanup }}
          MTP_REQUIRED: ${{ steps.check.outputs.mtp_required }}
          MTP_CURRENT: ${{ steps.check.outputs.mtp_current }}
          GAIA_NEEDS_UPDATE: ${{ steps.check.outputs.gaia_needs_update }}
          GAIA_CURRENT: ${{ steps.check.outputs.gaia_current }}
          GAIA_LATEST: ${{ steps.check.outputs.gaia_latest }}
          GAIA_SCRIPTS_LATEST: ${{ steps.check.outputs.gaia_scripts_latest }}
          GAIA_SCRIPTS_CURRENT: ${{ steps.check.outputs.gaia_scripts_current }}
          XDNA_BRANCH: ${{ steps.check.outputs.xdna_branch }}
          XDNA_REV_DRIFT: ${{ steps.check.outputs.xdna_rev_drift }}
        run: |
          git diff --quiet && echo "No changes" && exit 0

          # Did a real version actually move (vs. a bare lock refresh)? Drives
          # the honest title and header below.
          HAS_UPDATE=""
          [ "$FLM_LATEST" != "$FLM_CURRENT" ] && HAS_UPDATE=1
          [ "$LEM_LATEST" != "$LEM_CURRENT" ] && HAS_UPDATE=1
          [ "$XDNA_LATEST" != "$XDNA_CURRENT" ] && HAS_UPDATE=1
          [ "$VLLM_NEEDS_UPDATE" = "true" ] && HAS_UPDATE=1
          [ -n "$NIXPKGS_DIFFS" ] && HAS_UPDATE=1
          # A run that only refreshed the lock (no version/backend diff) isn't a
          # "bump" -- name it honestly.
          PR_TITLE="chore: bump upstream package versions"
          if [ -z "$HAS_UPDATE" ] && [ "$NIXPKGS_NEEDS_UPDATE" = "true" ]; then
            PR_TITLE="chore: refresh nixpkgs lock"
          fi

          BRANCH="update/$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "$PR_TITLE"
          git push origin "$BRANCH"

          # Build the body first, then pick a header that matches what actually
          # accumulated (below) -- so we never lead with "Upstream updates
          # detected" over an empty list.
          BODY=""
          [ "$FLM_LATEST" != "$FLM_CURRENT" ] && \
            BODY+="- FastFlowLM: $FLM_CURRENT -> $FLM_LATEST"$'\n'
          [ "$LEM_LATEST" != "$LEM_CURRENT" ] && \
            BODY+="- Lemonade: $LEM_CURRENT -> $LEM_LATEST"$'\n'
          [ "$XDNA_LATEST" != "$XDNA_CURRENT" ] && \
            BODY+="- xdna-driver: $XDNA_CURRENT -> $XDNA_LATEST"$'\n'
          if [ "$VLLM_NEEDS_UPDATE" = "true" ]; then
            BODY+="- vLLM-ROCm: \`$VLLM_CURRENT\` -> \`$VLLM_LATEST\` (built to validate; not GPU-tested)"$'\n'
          fi

          if [ -n "$NIXPKGS_DIFFS" ]; then
            BODY+=$'\n'"### nixpkgs backend versions"$'\n'
            BODY+="$NIXPKGS_DIFFS"
          fi

          if [ "$MTP_OVERRIDE_NEEDS_UPDATE" = "true" ]; then
            BODY+=$'\n'"### ⚠️ MTP override needs hand-bump"$'\n'
            BODY+="Lemonade v$LEM_LATEST pins \`llamacpp.vulkan = b$MTP_REQUIRED\`, but \`llamaCppMtpOverride\` in \`flake.nix\` is at \`b$MTP_CURRENT\`."$'\n'
            BODY+="Update \`version\`, \`rev\` (commit for tag \`b$MTP_REQUIRED\` in \`ggml-org/llama.cpp\`), and both hashes in the \`llamaCppMtpSrc\` / \`llamaCppMtpOverride\` blocks."$'\n'
          fi

          if [ "$MTP_CLEANUP" = "true" ]; then
            BODY+=$'\n'"**TODO:** drop \`llamaCppMtpOverride\` from \`flake.nix\` — nixpkgs llama-cpp has caught up to b$MTP_REQUIRED (what Lemonade pins)."$'\n'
          fi

          if [ "$GAIA_NEEDS_UPDATE" = "true" ]; then
            BODY+=$'\n'"### ⚠️ gaia needs a hand-bump"$'\n'
            BODY+="\`pkgs/gaia/default.nix\` names \`$GAIA_CURRENT\`; PyPI has \`$GAIA_LATEST\`."$'\n'
            BODY+="Console scripts in the published wheel: \`$GAIA_SCRIPTS_LATEST\`"$'\n'
            BODY+="Currently in \`bins\`: \`$GAIA_SCRIPTS_CURRENT\`"$'\n'
            BODY+="Update \`version\`, and \`bins\` if those two lists differ. gaia is a uvx wrapper with no hash to prefetch and it builds green either way, so nothing else catches this."$'\n'
          fi

          if [ "$FLAKE_CHECK_STATUS" = "fail" ]; then
            BODY+=$'\n'"### ⚠️ \`nix flake check\` failed"$'\n'
            BODY+=$'\n''```'$'\n'"$FLAKE_CHECK_LOG"$'\n''```'$'\n'
          fi

          if [ -n "$BUILD_FAILED" ]; then
            BODY+=$'\n'"### ⚠️ Build failures"$'\n'"$BUILD_FAILED"
          fi

          if [ "$XDNA_REV_DRIFT" = "true" ]; then
            BODY+=$'\n'"### ⚠️ xdna-driver: pinned rev out of sync with branch \`$XDNA_BRANCH\`"$'\n'
            BODY+="This run auto-advanced the \`rev\`/\`hash\` in \`pkgs/xrt-plugin-amdxdna/default.nix\` to the head of branch \`$XDNA_BRANCH\`, which is not a linear descendant of the previous pin (an upstream rebase/force-push, or a cross-branch jump). That bump is in this PR's diff -- verify it and merge, or revert it; do not merge it unreviewed."$'\n'
          fi

          # Header reflects what actually changed, not what triggered the run: a
          # real version move is an update, else a bare lock refresh. It is keyed
          # on HAS_UPDATE, not -n "$BODY", so a body holding only a warning (e.g.
          # a failed build on a lock refresh) isn't mislabelled.
          if [ -n "$HAS_UPDATE" ]; then
            HEADER="## Upstream updates detected"
          else
            HEADER="## nixpkgs lock refreshed (no packaged version changes)"
          fi
          BODY="${BODY#$'\n'}"
          if [ -n "$BODY" ]; then
            BODY="$HEADER"$'\n\n'"$BODY"
          else
            BODY="$HEADER"
          fi

          PR_URL=$(echo "$BODY" | gh pr create --title "$PR_TITLE" --body-file -)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # A newer release branch rewrites no pinned file, so there is no diff to
      # review -- it is a standing decision, and an issue holds one of those
      # across weekly runs. Keyed on the branch name, so 1.9 -> 2.0 later opens
      # its own.
      - name: Track new xdna-driver release branch
        if: steps.check.outputs.xdna_branch_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          XDNA_BRANCH: ${{ steps.check.outputs.xdna_branch }}
          XDNA_BRANCH_LATEST: ${{ steps.check.outputs.xdna_branch_latest }}
        run: |
          TITLE="xdna-driver: decide on release branch $XDNA_BRANCH_LATEST"
          # `--search ... in:title` is fuzzy/tokenized, so confirm an exact title
          # match before treating a hit as our standing issue -- otherwise an
          # unrelated issue sharing these words would suppress it.
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty" \
            2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "issue #$existing already tracks this decision"
            exit 0
          fi

          BODY="Tracking \`$XDNA_BRANCH\`, but \`$XDNA_BRANCH_LATEST\` exists -- a cross-release jump of hundreds of kernel-driver commits."$'\n\n'
          BODY+="Bump \`XDNA_BRANCH\` in \`scripts/check-updates.sh\` and the \`rev\`/\`hash\` in \`pkgs/xrt-plugin-amdxdna/default.nix\` together, by hand, after review."$'\n\n'
          BODY+="The branches diverge both ways, so the newer one is not a superset -- check what \`$XDNA_BRANCH\` carries that \`$XDNA_BRANCH_LATEST\` does not before moving the pin."$'\n'
          echo "$BODY" | gh issue create --title "$TITLE" --body-file -

      # Auto-merge only the clean path: this job already built the 4 packages and
      # ran flake check on the bumped tree, so build success here IS the gate.
      # MTP hand-bumps still build green with a stale override, so they stay for
      # review. The merge runs under RELEASE_PAT, not the default GITHUB_TOKEN,
      # because pushes made by GITHUB_TOKEN do not trigger other workflows — the
      # resulting push to main must fire build.yml (darwin build + release job).
      - name: Auto-merge clean bumps
        if: |
          steps.pr.outputs.pr_url != '' &&
          steps.flake_check.outputs.status == 'pass' &&
          steps.build.outputs.failed == '' &&
          steps.check.outputs.mtp_override_needs_update != 'true' &&
          steps.check.outputs.gaia_needs_update != 'true' &&
          steps.check.outputs.xdna_rev_drift != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
